name: Integrate Context-Aware Low-Pass Filter into source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-lowpass-source.yml'
      - 'Context-Aware-Low-Pass-Filter-Patch.zip'
  workflow_dispatch:

# This workflow commits the patched source back to main after the full build succeeds.
permissions:
  contents: write

concurrency:
  group: integrate-lowpass-source-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Low-Pass source patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH='Context-Aware-Low-Pass-Filter-Patch.zip'
          test -s "$PATCH"

          if [[ -f src/audioPlayers/lowPass.ts ]]; then
            echo 'Low-Pass module already exists; checking the integration rather than applying twice.'
            grep -q 'configureMusicLowPass' src/index.tsx
            grep -q 'setMusicLowPassPlayer' src/audioPlayers/changeMenuMusic.ts
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$RUNNER_TEMP/lowpass-patch"
            unzip -q "$PATCH" -d "$RUNNER_TEMP/lowpass-patch"
            APPLIER="$RUNNER_TEMP/lowpass-patch/context-aware-low-pass-filter/apply_feature.py"
            test -s "$APPLIER"
            test -s "$RUNNER_TEMP/lowpass-patch/context-aware-low-pass-filter/src/audioPlayers/lowPass.ts"
            python3 "$APPLIER" --repo "$GITHUB_WORKSPACE"

            # The patch applier creates local safety backups. Keep them out of Git.
            find . -maxdepth 1 -type d -name '.lowpass-feature-backup-*' -prune -exec rm -rf {} +
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin with permanent source changes
        run: |
          pnpm build
          test -s dist/index.js
          grep -q 'lowPass' dist/index.js

      - name: Validate integration and source changes
        shell: bash
        run: |
          set -euo pipefail
          test -s src/audioPlayers/lowPass.ts
          grep -q 'lowPassEnabled' src/state/GlobalState.tsx
          grep -q 'configureMusicLowPass' src/index.tsx
          grep -q 'setMusicLowPassPlayer' src/audioPlayers/changeMenuMusic.ts
          grep -q 'Context-aware Music Low-Pass Filter' README.md
          grep -q '"version": "1.2.5"' package.json
          git diff --check

      - name: Package installable Decky plugin
        run: |
          set -euo pipefail
          mkdir -p "out/Audio Loader Encore"
          cp -r dist "out/Audio Loader Encore/"
          cp main.py audio_utils.py audio_remoteinstall.py plugin.json package.json LICENSE README.md "out/Audio Loader Encore/"
          cd out
          zip -qr "$GITHUB_WORKSPACE/Audio-Loader-Encore.zip" "Audio Loader Encore"
          test -s "$GITHUB_WORKSPACE/Audio-Loader-Encore.zip"

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Loader-Encore-v1.2.5-LowPass
          path: Audio-Loader-Encore.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit permanent source integration to main
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            README.md \
            package.json \
            main.py \
            src/SteamClient.d.ts \
            src/index.tsx \
            src/state/GlobalState.tsx \
            src/audioPlayers/index.ts \
            src/audioPlayers/changeMenuMusic.ts \
            src/audioPlayers/musicGuard.ts \
            src/audioPlayers/lowPass.ts

          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi

          git commit -m 'Integrate context-aware music low-pass filter'
          git push origin HEAD:main

      - name: Report already-integrated source
        if: steps.patch.outputs.changed == 'false'
        run: echo 'Low-Pass source integration is already present. No files were changed.'
