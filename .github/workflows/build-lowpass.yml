
name: Build Audio Loader Encore with Low-Pass Filter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Context-Aware-Low-Pass-Filter-Patch.zip'
      - '.github/workflows/build-lowpass.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Extract low-pass patch
        run: |
          test -s Context-Aware-Low-Pass-Filter-Patch.zip
          mkdir -p "$RUNNER_TEMP/lowpass-patch"
          unzip -q Context-Aware-Low-Pass-Filter-Patch.zip -d "$RUNNER_TEMP/lowpass-patch"
          test -f "$RUNNER_TEMP/lowpass-patch/context-aware-low-pass-filter/apply_feature.py"
          test -f "$RUNNER_TEMP/lowpass-patch/context-aware-low-pass-filter/src/audioPlayers/lowPass.ts"

      - name: Apply low-pass feature to clean checkout
        run: |
          python3 "$RUNNER_TEMP/lowpass-patch/context-aware-low-pass-filter/apply_feature.py" --repo "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Verify build output
        run: test -s dist/index.js

      - name: Package Decky plugin
        run: |
          mkdir -p "out/Audio Loader Encore"
          cp -r dist "out/Audio Loader Encore/"
          cp main.py audio_utils.py audio_remoteinstall.py plugin.json package.json LICENSE README.md "out/Audio Loader Encore/"
          cd out
          zip -qr "$GITHUB_WORKSPACE/Audio-Loader-Encore-LowPass.zip" "Audio Loader Encore"
          test -s "$GITHUB_WORKSPACE/Audio-Loader-Encore-LowPass.zip"

      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Loader-Encore-LowPass
          path: Audio-Loader-Encore-LowPass.zip
          if-no-files-found: error
          retention-days: 14
