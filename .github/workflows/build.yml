name: Build plugin

# Runs by itself whenever you upload changes, and also has a "Run workflow" button.
on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Stop with a clear error if the build did not produce the plugin file
      - name: Check build output
        run: test -s dist/index.js

      # Collect only the files the Steam Deck needs, in a folder named "Audio Loader Encore"
      - name: Collect plugin files
        run: |
          mkdir -p "out/Audio Loader Encore"
          cp -r dist "out/Audio Loader Encore/"
          cp main.py audio_utils.py audio_remoteinstall.py plugin.json package.json LICENSE README.md "out/Audio Loader Encore/"

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Loader-Encore-built
          path: out

      # When a release is published on GitHub, attach the finished zip to it
      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd out
          zip -r "../Audio-Loader-Encore-${TAG}.zip" "Audio Loader Encore"
          cd ..
          gh release upload "$TAG" "Audio-Loader-Encore-${TAG}.zip" --clobber
